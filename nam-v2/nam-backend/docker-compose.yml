# NAM v2 backend — single-day build for NASA Space Apps 2026
#
# Run: docker compose up
# Then open http://localhost:8000/docs for the API.

services:
  nam-backend:
    build: .
    image: nam-backend:2.0.0-hack
    container_name: nam-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist tile cache across restarts
      - nam-tile-cache:/tmp/nam_tile_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  nam-tile-cache:
